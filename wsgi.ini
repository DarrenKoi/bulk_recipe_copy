[uwsgi]
chdir           = %d
module          = index
callable        = application

master          = true
; 상태(SQLite, 전송 스레드)가 프로세스 하나에 있어야 합니다.
processes       = 1
threads         = 4
enable-threads  = true
lazy-apps       = true
; pyarrow·BLAS 스레드 풀은 호스트 코어 수를 보고 커집니다(cgroup 할당 무시).
; 클라우드 CPU 1~1.5개에서 할당량을 소진하면 전송 스레드까지 같이 멈추므로 1로 묶습니다.
env             = OMP_NUM_THREADS=1
; 수동 재기동 전용(`touch restart.txt`). 야간 자동 재기동은 두지 않습니다.
; 재기동은 진행 중인 전송을 끊고, 끊긴 file 은 다음 부팅의 재기동 대조가 거둡니다.
touch-reload    = %drestart.txt
; max-requests·reload-on-rss·harakiri 는 두지 않습니다. 사람이 고르지 않은 시점에
; 프로세스(= 모든 전송)를 끊습니다. 메모리는 전송 단위 상한(TRANSFER_MAX_BYTES ×
; 스레드 상한)으로 묶습니다.

http-socket     = 0.0.0.0:5060
; SKEWNONO와 같은 게이트웨이를 거칩니다. 기본 4096이면 사내 쿠키가 많을 때
; "invalid request block size"로 요청을 버립니다.
buffer-size     = 32768
die-on-term     = true
need-app        = true
single-interpreter = true

log-date        = true
log-4xx         = true
log-5xx         = true
