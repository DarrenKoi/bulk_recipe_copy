[uwsgi]
chdir           = %d
module          = index
callable        = application

master          = true
; 상태(SQLite, 전송 스레드)가 프로세스 하나에 있어야 합니다.
processes       = 1
threads         = 4
enable-threads  = true
lazy-apps       = true
; 수동 재기동 전용(`touch restart.txt`). 야간 자동 재기동은 두지 않습니다.
; 재기동은 진행 중인 전송을 끊고, 끊긴 file 은 다음 부팅의 재기동 대조가 거둡니다.
touch-reload    = %drestart.txt
; max-requests·reload-on-rss·harakiri 는 두지 않습니다. 사람이 고르지 않은 시점에
; 프로세스(= 모든 전송)를 끊습니다. 메모리는 전송 단위 상한(TRANSFER_MAX_BYTES ×
; 스레드 상한)으로 묶습니다.

http-socket     = 0.0.0.0:5060
die-on-term     = true
need-app        = true
single-interpreter = true

log-date        = true
log-4xx         = true
log-5xx         = true
