[uwsgi]
chdir           = %d
module          = index
callable        = application

master          = true
; 상태(SQLite, 전송 스레드)가 프로세스 하나에 있어야 합니다.
processes       = 1
threads         = 4
enable-threads  = true
lazy-apps       = true
; touch-reload, max-requests 는 두지 않습니다. 재기동은 진행 중인 전송을 끊습니다.

http-socket     = 0.0.0.0:5060
die-on-term     = true
need-app        = true
single-interpreter = true

log-date        = true
log-4xx         = true
log-5xx         = true
