# 설치 가능한 패키지가 아니라 의존성 목록입니다(build-system 없음).
#   uv venv --python 3.11 .venv
#   uv pip install --python .venv -r pyproject.toml --extra dev
[project]
name = "bulk-recipe-copy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3",
    "python-dotenv>=1",
    "redis>=5",
    "pandas>=2",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyftpdlib"]

[tool.pytest.ini_options]
pythonpath = ["."]
